<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader for GoHighLevel</title>
    <style id="serp-auth-boot-css">#activationSection{display:none !important;} #activationSection[data-serp-auth-ui="1"]{display:block !important;} [data-serp-auth-loading="true"]{display:none !important;}</style>
    <script type="module" src="auth.js"></script>
    <script type="module" crossorigin src="popup.js"></script>
    <link rel="stylesheet" href="./styles/styles.css" />
    <link rel="stylesheet" href="./styles/popup-enhanced.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h2>SERP GoHighLevel Downloader</h2>
      </div>

      <div id="activationSection" class="activation-section"></div>

      <div id="mainContent" class="main-content hidden">
        <div id="loading" class="loading">
          <div class="spinner"></div>
          <p>Detecting video...</p>
        </div>

        <div id="error" class="error hidden">
          <p class="error-message"></p>
        </div>

        <div id="video-info" class="video-info hidden">
        <div class="video-card popup-card">
          <div class="video-thumbnail-container">
            <img id="thumbnail" class="video-thumbnail-image" src="" alt="Video thumbnail">
            <div class="thumbnail-placeholder" id="thumbnail-placeholder">
              <div class="placeholder-content">
                <div class="placeholder-icon">&#x1F3AC;</div>
                <div class="placeholder-text">No preview yet</div>
              </div>
            </div>
            <div class="video-duration-badge" id="duration-badge"></div>
          </div>

          <div class="video-content popup-card-body">
            <h3 id="video-title" class="video-title">Activate Video Downloader for GoHighLevel</h3>
            <div class="video-meta popup-video-meta">
              <span id="video-duration" class="duration"></span>
            </div>

            <div class="quality-section popup-quality-section">
            <label for="quality-select">Select Quality:</label>
            <select id="quality-select" class="quality-select">
              <option value="">Loading formats...</option>
            </select>
            </div>

            <button id="download-btn" class="download-btn">Download Video</button>
          </div>
        </div>
      </div>
      </div>
    </div>

      <script defer src="auth-ui.js"></script>
    <script defer src="trial-banner.js"></script>
      <script src="site-config.js"></script>
    <script defer src="update-notifier.js"></script>
</body>
</html>
